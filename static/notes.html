<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f8;
        }

        .page {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            min-height: 75vh;
            padding: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
        }

        .status {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }

        .back-link {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="header">
        <h2>Notes</h2>

        <a
            href="/dashboard"
            class="back-link"
        >
            ← Back to Dashboard
        </a>
    </div>

    <textarea
        id="notes"
        placeholder="Write anything here..."
    ></textarea>

    <div
        id="status"
        class="status"
    >
        Notes are saved automatically in this browser.
    </div>

</div>

<script>
    const notes = document.getElementById("notes");
    const status = document.getElementById("status");

    notes.value = localStorage.getItem(
        "task_manager_notes"
    ) || "";

    let timer;

    notes.addEventListener("input", function () {

        clearTimeout(timer);

        status.textContent = "Saving...";

        timer = setTimeout(function () {

            localStorage.setItem(
                "task_manager_notes",
                notes.value
            );

            status.textContent = "Saved automatically.";

        }, 500);
    });
</script>

</body>
</html>
