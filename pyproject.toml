[project]
name = "task-management"
version = "0.1.0"
description = "Local personal task management application"
readme = "README.md"
authors = [
    { name = "KiranMarella", email = "kiranmarella@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
task-management = "task_management:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
