<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}Task Manager{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/app.css') }}"
    >

    <script
        src="https://unpkg.com/htmx.org@2.0.8"
        defer
    ></script>
</head>

<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a
            class="navbar-brand fw-semibold"
            href="/dashboard"
        >
            Task Manager
        </a>

        <div class="d-flex gap-2">
            <a
                class="btn btn-outline-light btn-sm"
                href="/docs"
                target="_blank"
            >
                API Docs
            </a>

            <a
            class="btn btn-primary btn-sm"
            href="/tasks/new"
            >
                + New Task
            </a>
        </div>
    </div>
</nav>

<main class="container-fluid py-4 px-4">
    {% block content %}{% endblock %}
</main>

<script>
    function toggleChildren(taskId, button) {
        const childContainer = document.getElementById(
            `children-${taskId}`
        );

        if (!childContainer) {
            return;
        }

        const isHidden = childContainer.classList.contains(
            "d-none"
        );

        if (isHidden) {
            childContainer.classList.remove("d-none");
            button.textContent = "−";
            button.setAttribute("aria-expanded", "true");
        } else {
            childContainer.classList.add("d-none");
            button.textContent = "+";
            button.setAttribute("aria-expanded", "false");
        }
    }

    function expandAllTasks() {
        document
            .querySelectorAll(".task-children")
            .forEach((element) => {
                element.classList.remove("d-none");
            });

        document
            .querySelectorAll(".tree-toggle")
            .forEach((button) => {
                button.textContent = "−";
                button.setAttribute("aria-expanded", "true");
            });
    }

    function collapseAllTasks() {
        document
            .querySelectorAll(".task-children")
            .forEach((element) => {
                element.classList.add("d-none");
            });

        document
            .querySelectorAll(".tree-toggle")
            .forEach((button) => {
                button.textContent = "+";
                button.setAttribute("aria-expanded", "false");
            });
    }
</script>
</body>
</html>
